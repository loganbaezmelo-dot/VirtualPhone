<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Virtual Smartphone Simulator</title>
  <style>
    :root {
      --bg-color: #181a20;
      --card-bg: #232732;
      --accent-color: #60a5fa;
      --text-color: #ffffff;
      --subtext-color: #9aa0a6;
    }

    body.theme-oled {
      --bg-color: #000000;
      --card-bg: #121212;
      --accent-color: #3b82f6;
    }
    body.theme-cyberpunk {
      --bg-color: #0d0221;
      --card-bg: #240046;
      --accent-color: #ff007f;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-color);
      color: var(--text-color);
    }

    .phone-wrapper {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg-color);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Status Bar */
    .status-bar {
      height: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 600;
      z-index: 50;
      flex-shrink: 0;
    }

    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .pages-slider {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .page {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 10px 16px 50px;
      position: relative;
      overflow-y: auto;
    }

    /* Home Screen */
    .clock-widget {
      text-align: center;
      margin-top: 5px;
      margin-bottom: 20px;
    }
    .clock-widget .time {
      font-size: clamp(40px, 10vw, 64px);
      font-weight: 300;
      letter-spacing: -1px;
    }
    .clock-widget .date {
      font-size: 14px;
      color: var(--subtext-color);
      margin-top: 2px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }

    .app-icon {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }
    .app-icon:active {
      transform: scale(0.95);
    }
    .app-icon .icon-emoji {
      font-size: 30px;
    }
    .app-icon span {
      font-size: 13px;
      font-weight: 500;
    }

    /* Feed Screen */
    .feed-container {
      height: 100%;
      overflow-y: auto;
      padding-bottom: 50px;
    }
    .feed-container::-webkit-scrollbar { display: none; }
    .feed-card {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.4;
    }
    .feed-card h4 {
      margin-bottom: 4px;
      color: var(--accent-color);
    }

    .page-dots {
      position: absolute;
      bottom: 35px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transition: 0.3s;
    }
    .dot.active {
      background: #fff;
      width: 18px;
      border-radius: 8px;
    }

    /* Modal / Running App View */
    .app-view {
      position: absolute;
      inset: 0;
      background: var(--bg-color);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      padding: 40px 16px 40px;
    }
    .app-view.open {
      transform: translateY(0);
    }
    .app-header {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
    }

    /* Camera View Adjustments */
    .camera-box {
      flex: 1;
      width: 100%;
      min-height: 0;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #cameraVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 0 0;
      flex-shrink: 0;
    }
    .shutter-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
    }
    .shutter-btn:active { transform: scale(0.9); }

    /* Gallery */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      overflow-y: auto;
    }
    .gallery-item {
      aspect-ratio: 1;
      border-radius: 10px;
      object-fit: cover;
      width: 100%;
      background: var(--card-bg);
    }

    /* Notes */
    .note-input {
      width: 100%;
      background: var(--card-bg);
      border: none;
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 8px;
      outline: none;
      flex-shrink: 0;
    }
    .btn-action {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }
    .note-item {
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .note-delete {
      color: #ef4444;
      cursor: pointer;
      font-weight: bold;
    }

    /* Settings */
    .setting-group {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .setting-group select {
      background: var(--bg-color);
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      outline: none;
    }

    /* Gesture Home Bar */
    .gesture-bar-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      cursor: pointer;
    }
    .gesture-bar {
      width: 100px;
      height: 4px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="phone-wrapper" id="phoneWrapper">
    <div class="status-bar">
      <span id="statusClock">12:00</span>
      <span id="statusBattery">5G 📶 98%</span>
    </div>

    <div class="viewport" id="viewport">
      <div class="pages-slider" id="slider">
        
        <!-- Home Screen -->
        <div class="page" id="pageHome">
          <div class="clock-widget">
            <div class="time" id="homeClock">12:00</div>
            <div class="date" id="homeDate">Wednesday, Oct 24</div>
          </div>

          <div class="app-grid">
            <div class="app-icon" onclick="openCameraApp()">
              <span class="icon-emoji">📷</span>
              <span>Camera</span>
            </div>
            <div class="app-icon" onclick="openPhotosApp()">
              <span class="icon-emoji">🖼️</span>
              <span>Photos</span>
            </div>
            <div class="app-icon" onclick="openNotesApp()">
              <span class="icon-emoji">📝</span>
              <span>Notes</span>
            </div>
            <div class="app-icon" onclick="openSettingsApp()">
              <span class="icon-emoji">⚙️</span>
              <span>Settings</span>
            </div>
          </div>
        </div>

        <!-- Feed Screen -->
        <div class="page" id="pageFeed">
          <div class="feed-container">
            <h3 style="margin-bottom: 12px;">News Feed</h3>
            <div class="feed-card">
              <h4>🔥 Hardware Status</h4>
              All device modules and full viewport bounds are operational.
            </div>
            <div class="feed-card">
              <h4>📸 Live Camera</h4>
              Snap photos with native screen fitting.
            </div>
            <div class="feed-card">
              <h4>📝 Storage Persistent</h4>
              Notes and gallery are stored locally.
            </div>
          </div>
        </div>

      </div>

      <div class="page-dots">
        <div class="dot active" id="dot0"></div>
        <div class="dot" id="dot1"></div>
      </div>
    </div>

    <!-- Active App Modal -->
    <div class="app-view" id="appView">
      <div class="app-header" id="appTitle">App Name</div>
      <div class="app-content" id="appContent"></div>
    </div>

    <div class="gesture-bar-area" id="homeGestureBar">
      <div class="gesture-bar"></div>
    </div>
  </div>

  <canvas id="photoCanvas" style="display: none;"></canvas>

  <script>
    function updateClocks() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${hours % 12 || 12}:${minutes}`;
      document.getElementById('statusClock').textContent = timeStr;
      document.getElementById('homeClock').textContent = timeStr;

      const options = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('homeDate').textContent = now.toLocaleDateString(undefined, options);
    }
    updateClocks();
    setInterval(updateClocks, 1000);

    let currentPage = 0;
    const slider = document.getElementById('slider');
    const dot0 = document.getElementById('dot0');
    const dot1 = document.getElementById('dot1');

    function goToPage(page) {
      currentPage = page;
      slider.style.transform = `translateX(-${page * 50}%)`;
      if (page === 0) {
        dot0.classList.add('active');
        dot1.classList.remove('active');
      } else {
        dot1.classList.add('active');
        dot0.classList.remove('active');
      }
    }

    let touchStartX = 0;
    let touchStartY = 0;
    const viewport = document.getElementById('viewport');

    viewport.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    viewport.addEventListener('touchend', (e) => {
      const diffX = touchStartX - e.changedTouches[0].clientX;
      const diffY = touchStartY - e.changedTouches[0].clientY;
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
        if (diffX > 0 && currentPage === 0) goToPage(1);
        else if (diffX < 0 && currentPage === 1) goToPage(0);
      }
    });

    const appView = document.getElementById('appView');
    const appTitle = document.getElementById('appTitle');
    const appContent = document.getElementById('appContent');
    let isAppOpen = false;
    let cameraStream = null;

    function openAppContainer(title, htmlContent) {
      appTitle.textContent = title;
      appContent.innerHTML = htmlContent;
      appView.classList.add('open');
      isAppOpen = true;
    }

    function closeAppToHome() {
      if (isAppOpen) {
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
          cameraStream = null;
        }
        appView.classList.remove('open');
        isAppOpen = false;
      }
    }

    const gestureBar = document.getElementById('homeGestureBar');
    let barStartY = 0;
    gestureBar.addEventListener('click', closeAppToHome);
    gestureBar.addEventListener('touchstart', (e) => { barStartY = e.touches[0].clientY; }, { passive: true });
    gestureBar.addEventListener('touchend', (e) => {
      if (barStartY - e.changedTouches[0].clientY > 20) closeAppToHome();
    });

    let photosGallery = JSON.parse(localStorage.getItem('phone_photos') || '[]');

    async function openCameraApp() {
      const html = `
        <div class="camera-box">
          <video id="cameraVideo" autoplay playsinline></video>
        </div>
        <div class="camera-controls">
          <button class="shutter-btn" onclick="capturePhoto()"></button>
        </div>
      `;
      openAppContainer('Camera', html);

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
        document.getElementById('cameraVideo').srcObject = cameraStream;
      } catch (err) {
        document.getElementById('appContent').innerHTML = `
          <div style="text-align:center; margin-top: 30px; color:#ef4444;">
            <p>📷 Camera access not granted or unavailable.</p>
          </div>
        `;
      }
    }

    function capturePhoto() {
      const video = document.getElementById('cameraVideo');
      const canvas = document.getElementById('photoCanvas');
      if (!video) return;

      canvas.width = video.videoWidth || 300;
      canvas.height = video.videoHeight || 400;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg');

      photosGallery.unshift(dataUrl);
      localStorage.setItem('phone_photos', JSON.stringify(photosGallery.slice(0, 18)));

      appView.style.opacity = '0.3';
      setTimeout(() => { appView.style.opacity = '1'; }, 100);
    }

    function openPhotosApp() {
      photosGallery = JSON.parse(localStorage.getItem('phone_photos') || '[]');
      let photosHtml = '<div class="gallery-grid">';

      if (photosGallery.length === 0) {
        photosHtml = `<p style="color: var(--subtext-color); text-align: center; margin-top: 30px;">No photos yet. Open Camera to snap some!</p>`;
      } else {
        photosGallery.forEach(src => {
          photosHtml += `<img src="${src}" class="gallery-item" />`;
        });
        photosHtml += '</div>';
      }

      openAppContainer('Photos', photosHtml);
    }

    let notes = JSON.parse(localStorage.getItem('phone_notes') || '["Remember to water plants 🌱"]');

    function openNotesApp() {
      renderNotes();
    }

    function renderNotes() {
      let notesHtml = `
        <input type="text" id="noteInput" class="note-input" placeholder="Type a note and hit Add..." />
        <button class="btn-action" onclick="addNote()">Add Note</button>
        <div class="notes-list">
      `;

      notes.forEach((note, index) => {
        notesHtml += `
          <div class="note-item">
            <span>${note}</span>
            <span class="note-delete" onclick="deleteNote(${index})">✕</span>
          </div>
        `;
      });
      notesHtml += '</div>';
      openAppContainer('Notes', notesHtml);
    }

    function addNote() {
      const input = document.getElementById('noteInput');
      if (input && input.value.trim()) {
        notes.unshift(input.value.trim());
        localStorage.setItem('phone_notes', JSON.stringify(notes));
        renderNotes();
      }
    }

    function deleteNote(index) {
      notes.splice(index, 1);
      localStorage.setItem('phone_notes', JSON.stringify(notes));
      renderNotes();
    }

    function openSettingsApp() {
      const html = `
        <div class="setting-group">
          <span>Theme Preset</span>
          <select onchange="changeTheme(this.value)">
            <option value="default">Midnight Navy</option>
            <option value="theme-oled">AMOLED Black</option>
            <option value="theme-cyberpunk">Cyberpunk Neon</option>
          </select>
        </div>
        <div class="setting-group">
          <span>Battery Saver</span>
          <select onchange="toggleBatterySaver(this.value)">
            <option value="off">Off (100%)</option>
            <option value="on">On (20% Low Power)</option>
          </select>
        </div>
        <div class="setting-group">
          <span>Storage</span>
          <span style="color: var(--accent-color); font-weight: 600;">${photosGallery.length} Photos, ${notes.length} Notes</span>
        </div>
      `;
      openAppContainer('Settings', html);
    }

    function changeTheme(themeClass) {
      document.body.className = '';
      if (themeClass !== 'default') {
        document.body.classList.add(themeClass);
      }
    }

    function toggleBatterySaver(val) {
      const batEl = document.getElementById('statusBattery');
      if (val === 'on') {
        batEl.textContent = '🪫 20%';
        batEl.style.color = '#f59e0b';
      } else {
        batEl.textContent = '5G 📶 98%';
        batEl.style.color = '#fff';
      }
    }
  </script>
</body>
</html>
